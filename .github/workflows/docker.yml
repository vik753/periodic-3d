name: docker

# Builds the production images and runs the whole stack once (db + api + web)
# with the test dataset (the same steps as in docs/DEPLOY.md), then load-tests it with
# the dataset the site uses.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - "apps/api/src/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: write

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml --env-file infra/.env
    steps:
      - uses: actions/checkout@v4

      - name: Environment file
        run: |
          cp infra/.env.example infra/.env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" infra/.env

      - name: Build images
        run: |
          mkdir -p out/logs
          $COMPOSE build 2>&1 | tee out/logs/build.log

      - name: Start and load the test dataset
        id: stack
        run: |
          $COMPOSE up -d 2>&1 | tee out/logs/up.log
          $COMPOSE run --rm api p3d-api migrate 2>&1 | tee out/logs/migrate.log
          $COMPOSE run --rm -v "$PWD/apps/api/tests/fixtures/dataset:/data:ro" api p3d-api load /data \
            2>&1 | tee out/logs/load.log
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health > /dev/null && break; sleep 2; done

      - name: Smoke test
        id: smoke
        run: |
          set -e
          {
            echo "health: $(curl -sf http://localhost:8080/health)"
            echo "meta: $(curl -sf http://localhost:8080/api/v1/meta | head -c 300)"
            echo "element: $(curl -sf http://localhost:8080/api/v1/elements/Fe | head -c 200)"
            echo "index.html: $(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/)"
            echo "spa route: $(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/e/Fe/O)"
            echo "etag: $(curl -sf -D - -o /dev/null http://localhost:8080/api/v1/elements | grep -i etag)"
          } | tee out/logs/smoke.log
          curl -sf http://localhost:8080/api/v1/meta | grep -q '2026.01.01-test'

      - name: Load test (no cache, through nginx)
        id: load
        continue-on-error: true
        run: |
          bash tools/ci/load-test.sh 200 \
            "http://localhost:8080/api/v1/elements/Fe" \
            "http://localhost:8080/api/v1/compounds/Q283" \
            "http://localhost:8080/api/v1/pairs/O-Fe" \
            "http://localhost:8080/api/v1/compounds?elements=O&mode=contains" \
            "http://localhost:8080/api/v1/search?q=%D0%B2%D0%BE%D0%B4" | tee out/logs/load.log

      # The same stack with the dataset the site uses (data/DATASET): ~27 000 compounds.
      - name: Load test on the current dataset
        id: full
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/ci/fetch-dataset.sh out/full 2>&1 | tee out/logs/fetch-full.log
          $COMPOSE run --rm -v "$PWD/out/full:/data:ro" api p3d-api load /data/dataset.tar.gz \
            2>&1 | tee out/logs/db-load-full.log
          curl -sf http://localhost:8080/api/v1/meta | tee out/logs/meta-full.json
          echo
          urls=(
            "http://localhost:8080/api/v1/elements/O"
            "http://localhost:8080/api/v1/compounds/Q283"
            "http://localhost:8080/api/v1/pairs/H-O"
            "http://localhost:8080/api/v1/compounds?elements=C,H&mode=contains"
            "http://localhost:8080/api/v1/compounds?elements=Fe,O&mode=only"
            "http://localhost:8080/api/v1/search?q=%D0%BA%D0%B8%D1%81%D0%BB%D0%BE%D1%82%D0%B0"
          )
          {
            echo "# 32 parallel requests (a busy server; the load generator shares the 4 CPUs)"
            bash tools/ci/load-test.sh 150 "${urls[@]}"
            echo "# 4 parallel requests, each endpoint alone"
            CONCURRENCY=4 PER_URL=1 bash tools/ci/load-test.sh 50 "${urls[@]}"
          } | tee out/logs/load-full.log
          # Query plans of the heaviest statements, for tuning.
          $COMPOSE exec -T db psql -U p3d -d p3d -c "EXPLAIN ANALYZE SELECT id FROM compounds
            WHERE embedding IS NOT NULL ORDER BY embedding <=> (SELECT embedding FROM compounds WHERE id = 'Q283')
            LIMIT 8" > out/logs/plan-similar.txt 2>&1 || true

      - name: Container logs
        if: always()
        run: $COMPOSE logs --no-color > out/logs/compose.log 2>&1 || true

      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"stack": "${{ steps.stack.outcome }}", "smoke": "${{ steps.smoke.outcome }}", "load": "${{ steps.load.outcome }}", "full": "${{ steps.full.outcome }}"}' > out/summary.json
          bash tools/ci/publish-results.sh out docker "ci: docker results for ${GITHUB_SHA::7}"
