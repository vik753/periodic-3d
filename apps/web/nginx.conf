# Static site + API proxy. Long cache for hashed assets, short for index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static data files (if the site is built with VITE_DATA_MODE=static).
  location /data/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8000/health;
  }

  # Single-page app: every scene URL (/e/Fe, /c/Q283, /set/Fe-O) serves index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
