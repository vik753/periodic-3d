name: data

# Runs the data pipeline. Pushes to pipeline/ build a small slice (H, O, Fe) for
# quick feedback; a manual run builds the full dataset and can publish a release.

on:
  workflow_dispatch:
    inputs:
      only_elements:
        description: "Comma-separated element symbols (empty = all)"
        type: string
        default: ""
      limit:
        description: "Keep the N most famous compounds (0 = all)"
        type: string
        default: "0"
      descriptions:
        description: "Fetch Wikipedia descriptions"
        type: boolean
        default: true
      release:
        description: "Publish the dataset as a GitHub release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/data.yml"

permissions:
  contents: write
  actions: write # start the ci workflow after a new dataset release

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: pipeline
    env:
      RUN: ../tools/ci/run.sh
      ONLY: ${{ github.event_name == 'push' && 'H,O,Fe' || inputs.only_elements }}
      LIMIT: ${{ github.event_name == 'push' && '60' || inputs.limit }}
      DESCRIPTIONS: ${{ github.event_name == 'push' && 'true' || inputs.descriptions }}
      RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: bash $RUN pipeline-install bash ../tools/ci/uv-sync.sh

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          bash $RUN pipeline-lint bash -c "uv run ruff check src tests && uv run ruff format --check src tests"

      - name: Types
        id: types
        continue-on-error: true
        run: bash $RUN pipeline-mypy uv run mypy

      - name: Tests
        id: tests
        run: bash $RUN pipeline-tests uv run pytest -q

      - name: Restore raw-data cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Build dataset
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Materials Project API (Q.2: experimental or computed crystal). Optional.
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
        run: |
          VERSION="$(date -u +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          FLAG=$([ "$DESCRIPTIONS" = "true" ] && echo --descriptions || echo --no-descriptions)
          # Live logs are not readable from the dev container: publish the log tail every 5 minutes.
          mkdir -p out/logs out/progress
          (
            while sleep 300; do
              tail -n 80 out/logs/pipeline-build.log > out/progress/tail.log 2>/dev/null || true
              date -u +%FT%TZ > out/progress/updated
              bash ../tools/ci/publish-results.sh out/progress data/progress "ci: data progress" > /dev/null 2>&1 || true
            done
          ) &
          HEARTBEAT=$!
          code=0
          bash $RUN pipeline-build uv run p3d-pipeline build --out ../data/build --cache ../data/cache \
            --version "$VERSION" --only-elements "$ONLY" --limit "$LIMIT" $FLAG || code=$?
          kill "$HEARTBEAT" 2>/dev/null || true
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          tar -czf "../data/dataset-$VERSION.tar.gz" -C ../data/build "$VERSION"
          ls -la ../data
          du -sh "../data/build/$VERSION"

      # Golden set (Q.3): well-known substances must come out right, or nothing is published.
      - name: Verify the golden set
        id: verify
        if: steps.build.outcome == 'success' && env.ONLY == '' && env.LIMIT == '0'
        continue-on-error: true
        run: |
          bash $RUN pipeline-verify uv run p3d-pipeline verify "../data/build/$VERSION" \
            --report "../data/build/$VERSION/verify.md"

      # Save even after a failed build: the next run continues from what was fetched.
      - name: Save raw-data cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}

      - name: Publish dataset to ci-results
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/dataset
          cp "../data/build/$VERSION/report.md" "../data/build/$VERSION/manifest.json" out/dataset/
          cp "../data/build/$VERSION/verify.md" out/dataset/ 2>/dev/null || true
          size=$(stat -c %s "../data/dataset-$VERSION.tar.gz")
          # Small slices go to the branch whole; full datasets go to releases.
          if [ "$size" -lt 25000000 ]; then cp "../data/dataset-$VERSION.tar.gz" out/dataset/dataset.tar.gz; fi
          echo "$VERSION" > out/dataset/VERSION
          bash ../tools/ci/publish-results.sh out/dataset data/latest "ci: dataset $VERSION"

      - name: Publish release and switch the site to it
        if: steps.build.outcome == 'success' && steps.verify.outcome == 'success' && env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "data-$VERSION" "../data/dataset-$VERSION.tar.gz" \
            --title "Dataset $VERSION" --notes-file "../data/build/$VERSION/report.md" --latest=false
          mkdir -p ../data
          echo "release:data-$VERSION" > ../data/DATASET
          bash ../tools/ci/commit-back.sh "chore(data): use dataset $VERSION [skip ci]" ../data/DATASET
          # A push made with GITHUB_TOKEN starts no workflow; a dispatch does.
          gh workflow run ci.yml --ref main

      - name: Commit uv.lock back
        if: always() && github.ref == 'refs/heads/main'
        run: |
          bash ../tools/ci/commit-back.sh "chore(pipeline): update uv.lock [skip ci]" uv.lock

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/logs out/run
          cp -R out/logs out/run/
          cat > out/run/summary.json <<EOF
          {"lint": "${{ steps.lint.outcome }}", "types": "${{ steps.types.outcome }}",
           "tests": "${{ steps.tests.outcome }}", "build": "${{ steps.build.outcome }}",
           "version": "${VERSION:-none}"}
          EOF
          bash ../tools/ci/publish-results.sh out/run data/run "ci: data run ${GITHUB_SHA::7}"
