name: probe

# Measures data-source reachability and coverage (stage 0).
# Results go to the ci-results branch under probe/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/probe/**"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        run: python tools/probe/probe.py out/probe
      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish-results.sh out/probe probe "ci: probe results for ${GITHUB_SHA::7}"
