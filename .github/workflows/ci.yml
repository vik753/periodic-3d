name: ci

on:
  push:
    branches: [main]
    # Docs do not change the site; a docs push must not cancel a running deploy.
    # `make check` covers their whitespace locally.
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Whitespace and Python syntax
        run: make check

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: bash ../tools/ci/uv-sync.sh
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: p3d
          POSTGRES_PASSWORD: p3d
          POSTGRES_DB: p3d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p3d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      RUN: ../../tools/ci/run.sh
      DATABASE_URL: postgresql+asyncpg://p3d:p3d@localhost:5432/p3d
      TEST_DATABASE_URL: postgresql+asyncpg://p3d:p3d@localhost:5432/p3d_test
      P3D_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: bash $RUN api-install bash ../../tools/ci/uv-sync.sh

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          bash $RUN api-lint bash -c "uv run ruff check src tests && uv run ruff format --check src tests"

      - name: Types
        id: types
        continue-on-error: true
        run: bash $RUN api-mypy uv run mypy

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          PGPASSWORD=p3d psql -h localhost -U p3d -d p3d -c "CREATE DATABASE p3d_test" > /dev/null
          bash $RUN api-tests uv run pytest -q

      - name: Export static data from the current dataset
        id: export
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash $RUN api-fetch-dataset bash ../../tools/ci/fetch-dataset.sh out/dataset
          bash $RUN api-fetch-gnome bash ../../tools/ci/fetch-gnome.sh out/gnome
          bash $RUN api-migrate uv run p3d-api migrate
          bash $RUN api-load uv run p3d-api load out/dataset/dataset.tar.gz
          if [ -f out/gnome/gnome.tar.gz ]; then
            bash $RUN api-load-gnome uv run p3d-api load-gnome out/gnome/gnome.tar.gz
          fi
          bash $RUN api-export uv run p3d-api export-static out/static-data
          tar -czf out/static-data.tar.gz -C out/static-data .
          du -sh out/static-data | tee out/logs/static-data-size.log

      - uses: actions/upload-artifact@v4
        if: steps.export.outcome == 'success'
        with:
          name: static-data
          path: apps/api/out/static-data.tar.gz
          retention-days: 7

      - name: Commit uv.lock back
        if: always() && github.ref == 'refs/heads/main'
        run: |
          bash ../../tools/ci/commit-back.sh "chore(api): update uv.lock [skip ci]" uv.lock

      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/run
          cp -R out/logs out/run/ 2>/dev/null || true
          cat > out/run/summary.json <<EOF
          {"lint": "${{ steps.lint.outcome }}", "types": "${{ steps.types.outcome }}",
           "tests": "${{ steps.tests.outcome }}", "export": "${{ steps.export.outcome }}"}
          EOF
          bash ../../tools/ci/publish-results.sh out/run api "ci: api results for ${GITHUB_SHA::7}"

      - name: Fail on check errors
        if: >-
          steps.lint.outcome != 'success' ||
          steps.types.outcome != 'success' ||
          steps.tests.outcome != 'success'
        run: exit 1

  web:
    name: web
    needs: api
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      # branch: published to gh-pages; workflow: artifact uploaded for the pages job; none
      deployed: >-
        ${{ steps.deploy.outcome == 'success' && 'branch' ||
        (steps.upload.outcome == 'success' && 'workflow' || 'none') }}
    permissions:
      contents: write
      pages: read # publishing mode (gh-pages branch or workflow artifact)
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_BASE: /periodic-3d/
      RUN: ../../tools/ci/run.sh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bash $RUN web-install bash ../../tools/ci/npm-install.sh

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bash $RUN web-typecheck npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: bash $RUN web-lint npm run lint

      - name: Unit tests
        id: test
        continue-on-error: true
        run: bash $RUN web-test npm test

      - name: Build
        id: build
        run: bash $RUN web-build npm run build

      - name: Bundle size
        id: size
        continue-on-error: true
        run: bash $RUN web-size npm run size

      - name: Download static data
        id: data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: static-data
          # Outside out/: everything in out/ goes to the ci-results branch.
          path: ${{ runner.temp }}/static-data

      - name: Add static data to the site
        if: steps.data.outcome == 'success'
        run: |
          mkdir -p dist/data
          tar -xzf "$RUNNER_TEMP/static-data/static-data.tar.gz" -C dist/data
          cat dist/data/meta.json
          mkdir -p out/logs && du -sh dist | tee out/logs/site-size.log

      - name: Pages publishing mode
        id: pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "workflow": Pages serves the artifact of this workflow; "legacy": the gh-pages branch.
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)"
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

      - name: Screenshots (local preview)
        id: screenshots
        continue-on-error: true
        timeout-minutes: 12
        run: |
          npx playwright install --with-deps chromium > out/logs/playwright-install.log 2>&1 || true
          npx vite preview --port 4173 --strictPort > out/logs/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/periodic-3d/ > /dev/null && break; sleep 1; done
          SCREENSHOT_BASE=http://localhost:4173/periodic-3d/ bash $RUN web-screenshots npm run screenshot

      - name: Commit lockfile back
        if: always() && github.ref == 'refs/heads/main'
        run: |
          bash ../../tools/ci/commit-back.sh "chore(web): update package-lock.json [skip ci]" package-lock.json

      # Two ways to publish (ADR 0007). "workflow": Pages serves this workflow's artifact, the
      # full site with predicted materials. Otherwise: the gh-pages branch, known compounds only.
      - name: Deploy demo to the gh-pages branch
        id: deploy
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.pages.outputs.mode != 'workflow' &&
          steps.typecheck.outcome == 'success' &&
          steps.lint.outcome == 'success' &&
          steps.test.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The predicted materials (≈ 470 MB) do not go into a git branch.
          gnome="$(jq -r '.gnome.version // empty' dist/data/meta.json 2>/dev/null || true)"
          if [ -n "$gnome" ]; then
            rm -rf "dist/data/$gnome"
            jq -c 'del(.gnome)' dist/data/meta.json > "$RUNNER_TEMP/meta.json"
            mv "$RUNNER_TEMP/meta.json" dist/data/meta.json
          fi
          bash $RUN web-deploy bash ../../tools/ci/deploy-pages.sh dist

      - name: Prepare the site artifact
        id: artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.pages.outputs.mode == 'workflow' &&
          steps.typecheck.outcome == 'success' &&
          steps.lint.outcome == 'success' &&
          steps.test.outcome == 'success'
        run: |
          # GitHub Pages has no SPA fallback: serve the app for unknown paths too.
          cp dist/index.html dist/404.html
          echo "site: $(du -sh dist | cut -f1), $(find dist -type f | wc -l) files" | tee out/logs/site-artifact.log

      - name: Upload the site for GitHub Pages
        id: upload
        if: steps.artifact.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cat > out/summary.json <<EOF
          {"typecheck": "${{ steps.typecheck.outcome }}", "lint": "${{ steps.lint.outcome }}",
           "test": "${{ steps.test.outcome }}", "build": "${{ steps.build.outcome }}",
           "size": "${{ steps.size.outcome }}", "screenshots": "${{ steps.screenshots.outcome }}",
           "data": "${{ steps.data.outcome }}", "pages": "${{ steps.pages.outputs.mode }}",
           "deploy": "${{ steps.deploy.outcome }}", "upload": "${{ steps.upload.outcome }}"}
          EOF
          bash ../../tools/ci/publish-results.sh out web "ci: web results for ${GITHUB_SHA::7}"

      - name: Fail on check errors
        if: >-
          steps.typecheck.outcome != 'success' ||
          steps.lint.outcome != 'success' ||
          steps.test.outcome != 'success'
        run: exit 1

  pages:
    name: pages
    needs: web
    if: ${{ !cancelled() && needs.web.outputs.deployed == 'workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live:
    name: live demo
    needs: [web, pages]
    if: >-
      ${{ !cancelled() && (needs.web.outputs.deployed == 'branch' ||
      (needs.web.outputs.deployed == 'workflow' && needs.pages.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/web
    env:
      RUN: ../../tools/ci/run.sh
      SITE: https://vik753.github.io/periodic-3d/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          bash $RUN live-install bash ../../tools/ci/npm-install.sh
          npx playwright install --with-deps chromium > out/logs/playwright-install.log 2>&1 || true

      - name: Check the live demo
        id: check
        continue-on-error: true
        timeout-minutes: 12
        run: |
          # The branch deploy starts a Pages build (about a minute); the artifact deploy is live at once.
          if [ "${{ needs.web.outputs.deployed }}" = "branch" ]; then sleep 75; else sleep 10; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE")
          echo "live status: $code (${{ needs.web.outputs.deployed }})" | tee out/logs/live-status.log
          SCREENSHOT_BASE="$SITE" SCREENSHOT_OUT=out/live SCREENSHOT_SET=quick \
            bash $RUN web-live-screenshots npm run screenshot
          # Budgets on a throttled 4G network: LCP, JavaScript size, time to the 3D table.
          PERF_BASE="$SITE" PERF_OUT=out/perf bash $RUN web-perf npm run perf

      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          echo '{"deployed": "${{ needs.web.outputs.deployed }}", "check": "${{ steps.check.outcome }}"}' \
            > out/summary.json
          bash ../../tools/ci/publish-results.sh out web-live "ci: live demo results for ${GITHUB_SHA::7}"
